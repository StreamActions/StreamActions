name: "CodeQL"

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  schedule:
    - cron: '0 12 * * 2'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    if: github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        language:
          #- 'javascript'
          - 'python'
          - 'actions'
        autobuild: ['none']
        include:
          - language: 'csharp'
            autobuild: 'manual'

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup .NET Core
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.x'

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.autobuild }}

      - name: Build with dotnet
        if: matrix.language == 'csharp'
        run: dotnet build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
