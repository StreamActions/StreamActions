name: "CodeQL"

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  schedule:
    - cron: '0 12 * * 2'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    if: github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        language:
          #- 'javascript'
          - 'python'
          - 'actions'
        autobuild: ['none']
        include:
          - language: 'csharp'
            autobuild: 'manual'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET Core
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@55aa1d29038906879490fb63e58ae8bac369c88f # codeql-bundle-v2.27.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.autobuild }}

      - name: Build with dotnet
        if: matrix.language == 'csharp'
        run: dotnet build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@55aa1d29038906879490fb63e58ae8bac369c88f # codeql-bundle-v2.27.5
