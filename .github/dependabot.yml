version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      codeql-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: "nuget"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        versions:
          - ">= 11.0.0"
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        versions:
          - ">= 11.0.0"
      - dependency-name: "Microsoft.Extensions.*"
        versions:
          - ">= 11.0.0"
    groups:
      microsoft-identitymodel-security:
        applies-to: security-updates
        patterns:
          - "Microsoft.IdentityModel.*"
      microsoft-extensions-logging-security:
        applies-to: security-updates
        patterns:
          - "Microsoft.Extensions.Logging"
          - "Microsoft.Extensions.Logging.*"
  - package-ecosystem: "uv"
    directories:
      - "/Diff"
      - "/TldRegexUpdater"
      - "/DependencyUpdater"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "docker"
    directory: "/StreamActions.Daemon"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
